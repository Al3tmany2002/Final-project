<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة تأثير الظهور البطيء</title>
    
    <style>
        /* تنسيقات عامة لتجميل الصفحة */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
        }

        /* واجهة البداية لتأخذ مساحة الشاشة بالكامل ونجبر المستخدم على النزول */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            font-size: 24px;
        }

        /* -------------------------------------- */
        /* أكواد الـ CSS الخاصة بالأنيميشن (المهمة) */
        /* -------------------------------------- */
        
        .hidden-section {
            /* الحالة الابتدائية: مخفي ومسحوب للأسفل */
            opacity: 0;
            transform: translateY(100px);
            transition: all 1.2s ease-out; /* مدة الحركة 1.2 ثانية */
            
            /* تنسيقات شكلية للسكشن */
            background: white;
            padding: 80px 20px;
            margin: 100px auto;
            max-width: 600px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .show-section {
            /* الحالة النهائية: ظاهر وفي مكانه الطبيعي */
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- الجزء العلوي من الصفحة -->
    <div class="hero hidden-section">
        <h1>انزل لأسفل لترى التأثير 👇</h1>
    </div>

    <!-- السكاشن التي سيتم تطبيق التأثير عليها -->
    <section class="hidden-section">
        <h2>السكشن الأول</h2>
        <p>هذا السكشن ظهر ببطء بسلاسة عند الوصول إليه.</p>
    </section>

    <section class="hidden-section">
        <h2>السكشن الثاني</h2>
        <p>الأنيميشن يعطي حياة للموقع ويحسن تجربة المستخدم.</p>
    </section>

    <section class="hidden-section">
        <h2>السكشن الثالث</h2>
        <p>الكود جاهز لتستخدمه في مشاريعك الخاصة!</p>
    </section>

    <!-- مساحة إضافية في الأسفل -->
    <div style="height: 50vh;"></div>

    <script>
        // 1. تحديد جميع العناصر التي تمتلك كلاس hidden-section
        const sections = document.querySelectorAll('.hidden-section');

        // 2. إعداد المراقب (Observer)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                // إذا ظهر العنصر في الشاشة
                if (entry.isIntersecting) {
                    entry.target.classList.add('show-section');
                }
            });
        }, {
            // الانيميشن يبدأ عندما يظهر 20% من السكشن
            threshold: 0.2 
        });

        // 3. ربط المراقب بالسكاشن
        sections.forEach((section) => {
            observer.observe(section);
        });
    </script>
</body>
</html>
