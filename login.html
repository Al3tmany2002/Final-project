<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaro - Login</title>
    <!-- ربط ملف الـ CSS -->
    <link rel="stylesheet" href="assets/CSS/login.css">
</head>
<body>

    <div class="login-container">
        <div class="bg-decoration"></div>

        <!-- القسم الأيسر: صور البيتزا -->
        <div class="left-panel">
            <div class="brand-logo">Pizzaro</div>
            
        </div>

        <!-- القسم الأيمن: نموذج تسجيل الدخول -->
        <div class="right-panel">
            <div class="login-box">
                <h2>Welcome </h2>
                
                <form id="pizzaroLoginForm">
                    <div class="input-group">
                        <input type="email" id="loginEmail" placeholder="E-mail" required>
                    </div>
                    
                    <div class="input-group">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                    </div>
                    
                    <div class="forgot-password">
                        <a href="#">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="login-btn">Login</button>
                </form>

                <div class="divider">
                    <span>Or</span>
                </div>

                <div class="social-login">
                    <button class="social-btn" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.3 7.26 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.8 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.26 0 3.17 2.7 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                        Google
                    </button>
                    <button class="social-btn" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                        Facebook
                    </button>
                </div>

                <div class="signup-prompt">
                    Don't have an account? <a href="Regestration.html">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <!-- ربط ملف الـ JavaScript -->
    <script src="assets/JS/login.js"></script>
</body>
</html>
